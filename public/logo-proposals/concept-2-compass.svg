<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <style>
      .text-navy { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #001e56; }
      .text-red { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #df3629; }
      .text-light { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #001e56; opacity: 0.5; }
    </style>
  </defs>

  <!-- Compass icon mark -->
  <g transform="translate(70, 68)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#001e56" stroke-width="3"/>
    <!-- Inner diamond/compass -->
    <polygon points="0,-30 12,0 0,30 -12,0" fill="none" stroke="#001e56" stroke-width="2"/>
    <!-- North arrow fill -->
    <polygon points="0,-30 12,0 0,-8" fill="#df3629"/>
    <polygon points="0,-30 -12,0 0,-8" fill="#001e56"/>
    <!-- South arrow fill -->
    <polygon points="0,30 12,0 0,8" fill="#001e56" opacity="0.3"/>
    <polygon points="0,30 -12,0 0,8" fill="#001e56" opacity="0.5"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="#df3629"/>
    <!-- Cardinal ticks -->
    <line x1="0" y1="-52" x2="0" y2="-44" stroke="#001e56" stroke-width="2"/>
    <line x1="52" y1="0" x2="44" y2="0" stroke="#001e56" stroke-width="2"/>
    <line x1="0" y1="52" x2="0" y2="44" stroke="#001e56" stroke-width="2"/>
    <line x1="-52" y1="0" x2="-44" y2="0" stroke="#001e56" stroke-width="2"/>
  </g>

  <!-- OPB text -->
  <text x="140" y="90" class="text-navy" font-size="72" font-weight="800" letter-spacing="-2">OPB</text>

  <!-- Vertical separator line -->
  <line x1="345" y1="30" x2="345" y2="120" stroke="#001e56" stroke-width="1.5" opacity="0.2"/>

  <!-- 360° -->
  <text x="365" y="90" class="text-red" font-size="60" font-weight="700" letter-spacing="-1">360°</text>

  <!-- Tagline -->
  <text x="140" y="135" class="text-light" font-size="11" font-weight="500" letter-spacing="3.5">LOGISTICA INTEGRAL PARA CARGAS</text>
</svg>