<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <style>
      .text-navy { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #001e56; }
      .text-red { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #df3629; }
    </style>
  </defs>

  <!-- OPB text -->
  <text x="20" y="105" class="text-navy" font-size="80" font-weight="800" letter-spacing="-2">OPB</text>

  <!-- 360 with orbital ring -->
  <g transform="translate(280, 72)">
    <!-- Circular orbit ring (open arc) -->
    <path d="M 60,0 A 60,60 0 1,1 52,-30" fill="none" stroke="#df3629" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Arrow tip on the orbit -->
    <polygon points="56,-30 46,-22 48,-34" fill="#df3629"/>

    <!-- 360 text centered in ring -->
    <text x="0" y="12" class="text-red" font-size="52" font-weight="700" text-anchor="middle" letter-spacing="-1">360</text>

    <!-- Degree symbol integrated with ring -->
    <circle cx="42" cy="-18" r="6" fill="none" stroke="#df3629" stroke-width="2.5"/>
  </g>
</svg>